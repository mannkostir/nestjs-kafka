name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nest: [11, 12]
    name: verify (nest ${{ matrix.nest }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.nest == 11
        run: npm install --no-save @nestjs/common@^11 @nestjs/core@^11 @nestjs/testing@^11
      - run: |
          node -e "process.exit(require('./node_modules/@nestjs/core/package.json').version.startsWith('${{ matrix.nest }}.') ? 0 : 1)"
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: >-
          npm install --prefix examples/basic --install-links --no-package-lock --no-save
          @nestjs/common@^${{ matrix.nest }} @nestjs/core@^${{ matrix.nest }}
      - run: npm run typecheck --prefix examples/basic
      - run: npm run build --prefix examples/basic

  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.12.0']
        nest: [11, 12]
    name: load (node ${{ matrix.node }}, nest ${{ matrix.nest }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.nest == 11
        run: npm install --no-save @nestjs/common@^11 @nestjs/core@^11 @nestjs/testing@^11
      - run: |
          node -e "process.exit(require('./node_modules/@nestjs/core/package.json').version.startsWith('${{ matrix.nest }}.') ? 0 : 1)"
      - run: npm run build:compile
      - run: node scripts/check-entry-points.js

  esm-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20.18.3', '22.11.0']
        nest: [11, 12]
    name: esm floor (node ${{ matrix.node }}, nest ${{ matrix.nest }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.nest == 11
        run: npm install --no-save @nestjs/common@^11 @nestjs/core@^11 @nestjs/testing@^11
      - run: |
          node -e "process.exit(require('./node_modules/@nestjs/core/package.json').version.startsWith('${{ matrix.nest }}.') ? 0 : 1)"
      - run: npm run build:compile
      - run: |
          node --input-type=module -e "import 'reflect-metadata'; const { KafkaModule } = await import('nestjs-kafka-connector'); if (typeof KafkaModule.register !== 'function') process.exit(1);"

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nest: [11, 12]
    name: integration (nest ${{ matrix.nest }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.nest == 11
        run: npm install --no-save @nestjs/common@^11 @nestjs/core@^11 @nestjs/testing@^11
      - run: |
          node -e "process.exit(require('./node_modules/@nestjs/core/package.json').version.startsWith('${{ matrix.nest }}.') ? 0 : 1)"
      - run: npm run test:integration
        timeout-minutes: 25
        env:
          KAFKA_CLIENT_DEBUG: ${{ vars.KAFKA_CLIENT_DEBUG }}
          KAFKA_CLIENT_DEBUG_LOG: ${{ runner.temp }}/kafka-client-debug.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kafka-client-debug-nest-${{ matrix.nest }}
          path: ${{ runner.temp }}/kafka-client-debug.log
          if-no-files-found: ignore

  peer-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        nest: [11, 12]
    name: peer floor (nest ${{ matrix.nest }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npm install --no-save --package-lock=false
          @confluentinc/kafka-javascript@1.10.1
          @kafkajs/confluent-schema-registry@3.0.0
          @nestjs/common@^${{ matrix.nest }}
          @nestjs/core@^${{ matrix.nest }}
          @nestjs/testing@^${{ matrix.nest }}
      - run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          for (const [name, expected] of Object.entries({
            '@confluentinc/kafka-javascript': '1.10.1',
            '@kafkajs/confluent-schema-registry': '3.0.0',
          })) {
            const installed = require(`./node_modules/${name}/package.json`).version;
            console.log(`${name}: ${installed}`);
            assert.equal(installed, expected);
          }
          for (const name of ['@nestjs/common', '@nestjs/core', '@nestjs/testing']) {
            assert.equal(require(`./node_modules/${name}/package.json`).version.split('.')[0], '${{ matrix.nest }}');
          }
          NODE
      - run: npx tsc --noEmit
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run test:integration
        timeout-minutes: 25
        env:
          KAFKA_CLIENT_DEBUG: ${{ vars.KAFKA_CLIENT_DEBUG }}
          KAFKA_CLIENT_DEBUG_LOG: ${{ runner.temp }}/kafka-client-debug.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kafka-client-debug-peer-floor-nest-${{ matrix.nest }}
          path: ${{ runner.temp }}/kafka-client-debug.log
          if-no-files-found: ignore
